##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = brave-pip
    match:title = ^(Picture in picture)$
    
    # Effects
    float = on
    pin = on
    size = 426 240
    move = (monitor_w-446) (monitor_h-260)
    keep_aspect_ratio = on
    persistent_size = on
    no_initial_focus = on
}

windowrule {
    name = zen-pip
    # Match the static initial title to avoid losing the rule on resize
    match:initial_title = ^(Picture-in-Picture)$
    
    # Core behavior (strict typing requires 'on' or '1')
    float = on
    pin = on
    
    # Geometry - using space separation without commas
    size = 426 240
    move = (monitor_w-446) (monitor_h-260)
    
    # Dynamic effects to keep it from snapping back
    keep_aspect_ratio = on
    persistent_size = on
    no_initial_focus = on
}

windowrule {
    name = thunar-operations
    match:class = ^(thunar)$
    match:title = ^(File Operation Progress)$
    
    float = on
    center = on
    size = 450 380
    max_size = 450 380
}
